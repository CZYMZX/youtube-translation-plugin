<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="50%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <filter id="subtle-shadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1E1B4B" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Squircle 圆角背景 -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bg-grad-1)" filter="url(#subtle-shadow)"/>

  <!-- 高光内描边 -->
  <rect x="8.5" y="8.5" width="111" height="111" rx="27.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="1.5"/>

  <!-- 矢量 A (左侧，加粗几何体，针对小尺寸优化) -->
  <path d="M 40 37 L 27 75 L 35 75 L 37.8 66 L 47.2 66 L 50 75 L 58 75 Z M 42.5 48.5 L 45.4 59 L 39.6 59 Z" fill="#FFFFFF"/>

  <!-- 矢量 “文” (右侧，几何化加粗，平稳有力) -->
  <!-- 点 -->
  <path d="M 88 35.5 C 90 35.5 91.5 37 91.5 39 C 91.5 42 88.5 44 86 44.5 C 84.5 44.5 84 43 84.5 41 C 85.5 37.5 87 35.5 88 35.5 Z" fill="#FFFFFF"/>
  <!-- 横 -->
  <rect x="69" y="47" width="37" height="6.5" rx="3.25" fill="#FFFFFF"/>
  <!-- 撇捺交错笔画 -->
  <path d="M 83.5 53 C 83.5 61 80 69 71 74 C 69.5 75 72 77 73.5 76 C 82.5 71 87.5 63 88.5 53 Z" fill="#FFFFFF"/>
  <path d="M 77 56.5 C 81 61.5 87.5 69 98 73.5 C 100 74.5 101.5 72.5 99.5 71.5 C 90.5 67 85 60.5 81.5 56.5 Z" fill="#FFFFFF"/>

  <!-- 底部极简互换双箭头 ⇄ (增强动感与识别度) -->
  <g fill="#FFFFFF" opacity="0.95">
    <!-- 上箭头：向右 -->
    <path d="M 44 89 L 68 89 C 69.5 89 69.5 86.5 68 86.5 L 44 86.5 C 42.5 86.5 42.5 89 44 89 Z"/>
    <path d="M 66 84.5 L 71 87.8 L 66 91 C 65 91.7 64 90.2 64.8 89.6 L 68.5 87.8 L 64.8 85.9 C 64 85.3 65 83.8 66 84.5 Z"/>
    
    <!-- 下箭头：向左 -->
    <path d="M 84 97 L 60 97 C 58.5 97 58.5 99.5 60 99.5 L 84 99.5 C 85.5 99.5 85.5 97 84 97 Z"/>
    <path d="M 62 101.5 L 57 98.2 L 62 95 C 63 94.3 64 95.8 63.2 96.4 L 59.5 98.2 L 63.2 100.1 C 64 100.7 63 102.2 62 101.5 Z"/>
  </g>
</svg>