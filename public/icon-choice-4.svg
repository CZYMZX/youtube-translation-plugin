<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- 环形流光渐变 -->
    <linearGradient id="ring-grad-a" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="ring-grad-b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <filter id="glow-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0284C7" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- 科技感圆角背景 (深海深色底板，突显光环与字符) -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="#0B0F19"/>
  <rect x="8.5" y="8.5" width="111" height="111" rx="27.5" fill="none" stroke="#1E293B" stroke-width="1.5"/>

  <!-- 双向流动互换圆弧 -->
  <!-- 上半环弧线 (向右顺时针流动并带有箭头) -->
  <path d="M 32 60 A 32 32 0 0 1 96 60" fill="none" stroke="url(#ring-grad-a)" stroke-width="7" stroke-linecap="round"/>
  <!-- 顺时针指向右下方的箭头 -->
  <path d="M 92 50 L 98 62 L 86 64" fill="none" stroke="url(#ring-grad-a)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 下半环弧线 (向左逆时针流动并带有箭头) -->
  <path d="M 96 68 A 32 32 0 0 1 32 68" fill="none" stroke="url(#ring-grad-b)" stroke-width="7" stroke-linecap="round"/>
  <!-- 指向左上方的箭头 -->
  <path d="M 36 78 L 30 66 L 42 64" fill="none" stroke="url(#ring-grad-b)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 圆心区域：极简高对比度的 A ⇄ 文 核心字符 -->
  <!-- 左上部字母 A -->
  <g fill="#38BDF8">
    <path d="M 52 46 L 44 67 L 48.5 67 L 50.2 62 L 55.8 62 L 57.5 67 L 62 67 Z M 53.1 53.2 L 54.8 58.5 L 51.4 58.5 Z"/>
  </g>

  <!-- 右下部汉字 “文” -->
  <g fill="#F472B6">
    <!-- 点 -->
    <circle cx="76" cy="62" r="2"/>
    <!-- 横 -->
    <rect x="67" y="66" width="19" height="3.5" rx="1.75"/>
    <!-- 撇捺 -->
    <path d="M 75 70 C 75 74.5 73 78.5 68 81 C 67 81.5 68.5 82.5 69.5 82 C 74.5 79.5 77 75.5 77.5 70 Z"/>
    <path d="M 72 72.5 C 74.5 75.5 78 79.5 83.5 81.5 C 84.5 82 85 81 84 80.5 C 79.5 78.5 76.5 75 74.5 72.5 Z"/>
  </g>
</svg>